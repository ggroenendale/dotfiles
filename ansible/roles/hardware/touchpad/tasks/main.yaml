---
- name: Display Hardware Touchpad Config Start
  ansible.builtin.debug:
    msg: "=== Begin Hardware Mouse Role Configuration ==="

# ===========================================================================
#
# ===========================================================================

- name: If Arch, Include Arch Hardware Touchpad Config
  include_tasks: arch.yaml
  when: is_arch

- name: If Debian, Include Debian Hardware Touchpad Config
  include_tasks: debian.yaml
  when: is_debian

- name: If OpenSUSE, Include OpenSUSE Hardware Touchpad Config
  include_tasks: opensuse.yaml
  when: is_opensuse

- name: If Ubuntu, Include Ubuntu Hardware Touchpad Config
  include_tasks: ubuntu.yaml
  when: is_ubuntu

  # ===========================================================================
#
# ===========================================================================

- name: Display Hardware Touchpad Config End
  ansible.builtin.debug:
    msg: "=== End Hardware Touchpad Role Configuration ==="
